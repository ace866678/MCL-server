#Minecraft server configuration — Paper
#
# SEED FILE. `mc install` copies this into server/server.properties the first
# time it runs, and never overwrites it afterwards. Once the server has booted,
# server/server.properties is the live config; edit that one, not this one.

# ---- identity ---------------------------------------------------------------
# Shown in the multiplayer server list. Set something before going public.
motd=Cross-play Paper server
server-name=crossplay-server

# ---- network ----------------------------------------------------------------
# server-ip binds a single interface. Leave it blank to listen on all of them,
# which is what you want on a cloud VM behind a public IP.
server-port=25565
server-ip=
# Geyser opens this for Bedrock clients. Change it in Geyser's own config if
# you need a non-default port, and open the matching UDP port too.
broadcast-rcon-to-ops=false
query.port=25565
enable-rcon=false
enable-query=false

# ---- players ----------------------------------------------------------------
# online-mode=true is what makes Mojang authentication work, and it is the
# default Floodgate needs for Bedrock players to keep their inventory when they
# switch between Java and Bedrock.
online-mode=true
max-players=20
white-list=false
enforce-whitelist=false
op-permission-level=4
player-idle-timeout=0
rate-limit=0
hide-death-messages=false
allow-flight=false
prevent-proxy-connections=false

# ---- world ------------------------------------------------------------------
level-name=world
level-seed=
# Leave level-type at minecraft:normal. A superflat seed is a one-off, not a
# setting.
level-type=minecraft\:normal
gamemode=survival
difficulty=normal
max-world-size=29999984
allow-nether=true
allow-end=true
generate-structures=true
spawn-protection=16
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
# Slightly lower than the vanilla 10: it is cheaper, and the difference is not
# visible until render distance is cranked up.
view-distance=10
simulation-distance=10
use-native-transport=true
network-compression-threshold=256
sync-chunk-writes=false

# ---- upkeep -----------------------------------------------------------------
enable-command-block=false
max-tick-time=60000
enable-jmx-monitoring=false
enable-status=false
broadcast-console-to-ops=true
